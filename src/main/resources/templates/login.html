<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <title>Login</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    </head>
    
    <body style="height: 100vh; background-color: #dee2e6" class="d-flex justify-content-center align-items-center ">
        <div class="card shadow p-4 mb-6 bg-body rounded container-sm" style="max-width: 400px">
            <div class="container justify-content-center align-items-center col-4">
            <h3>Login</h3>
            </div>
            <div class="card-body">
                <form class="d-grid gap-3"th:action="@{/logar}" th:object="${credenciais}" method="post">
                    
                    <div class="form-floating">
                        <input type="email" th:field="*{email}" class="form-control" id="floatingInput" placeholder="name@example.com">
                        <label for="floatingInput">Email</label>
                    </div>
                    
                    <div class="form-floating">
                        <input type="password" th:field="*{senha}" class="form-control" id="floatingPassword" placeholder="Password">
                        <label for="floatingPassword">Senha</label>
                    </div>

                    <div>
                        <button style="width: 100%" type="submit" class="btn btn-success">Logar</button>
                    </div>
                    
                    <div class="d-flex flex-column bd-highlight gap-2 ">
                        <a th:href="@{index}" href="./inicio"><button style="width: 100%" type="submit" class="btn btn-info">Voltar ao inicio</button></a>
                    </div>
                    
                </form>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    </body>
</html>
