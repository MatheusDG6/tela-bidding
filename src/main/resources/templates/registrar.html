<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <title>Cadastrar</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>

    <body class="d-flex" style="height: 100vh;align-content: center">
        <div class="container d-flex col-12 justify-content-center align-items-center" style="">
            <div class="row col-4">
            <div class="container justify-content-center align-items-center col-6">
                <h2>CADASTRAR</h2>
            </div>
            <form 
                th:action="@{/registrar}" 
                th:object="${user}" method="post"
                >
                
                <div class="form-floating mb-2">
                    <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
                    <label for="floatingInput">Nome</label>
                    <label>Nome: </label>
                    <br/>
                </div>
                
                <div class="form-floating mb-2">
                    <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
                    <label for="floatingInput">Email</label>
                    <label>Email: </label>
                    <br/>
                </div>
                
                <div class="form-floating mb-2">
                    <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
                    <label for="floatingPassword">Senha</label>
                    <label>Senha: </label>
                    <br/>
                </div>
                
                <div class="justify-content-center align-middle">
                    <button type="button" class="btn btn-success w-100">Cadastrar</button>
                </div>
            </form>
            </div>
        </div>
    </body>
</html>
